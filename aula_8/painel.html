<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>painel</title>
</head>

<body>

    <nav class="flex items-center py-3 px4 shadow-lg fixed top-0 w-full bg-secondary">
        <h1>Meu formuário</h2>
            <p id="bemVindo"></p>
    </nav>
<main class="mt-6">
        <section class="bg-about p- max">
            <h2>Preencha as informações abaixo:</h2>
            <form id="formRegister">
                Nome: <input id="iName" type="text" placeholder="Digite seu nome completo" />
                Email: <input id="iEmail" type="email" placeholder="Digite seu melhor email" /> <br>
                Senha: <input id="iPass" type="password" placeholder="Letra maiuscula e números" />
                Data de nascimento: <input id="iBirth" type="date" /><br>
                <br>
                <button type="submit">Salvar</button>

            </form>

            <h2>Resposta</h2>
            <pre .></pre>

            <script src="user.js"></script>
        </section>
    </main>
</body>

</html>
